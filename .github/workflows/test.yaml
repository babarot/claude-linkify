name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # Mods are early access and may change between Claude Code releases; a
  # weekly run against the latest one catches a release that breaks the mod.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show the version
        run: claude --version
      - name: Validate
        run: claude plugin validate --strict .
      - name: Test
        run: claude plugin test .
